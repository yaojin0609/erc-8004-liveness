# 抓取与探测配置
#
# ⚠️ [limits] 一节是伦理红线的参数化，不是性能调优旋钮。
#    调大任何一个值之前，先读 实施规划 §5 Stage 06 和 CLAUDE.md 硬约束 11–16。

[identity]
# 每个出站请求都必须带这个 UA。${} 从 .env 读取，缺失则程序拒绝启动（不许匿名扫描）。
user_agent = "ERC8004-Research-Scanner/1.0 (+${SCANNER_REPO_URL}; ${SCANNER_CONTACT_EMAIL})"
blocklist_file = "config/blocklist.txt"    # 每次请求前检查；投诉方立即加入并永久排除

[limits]
global_rps          = 10.0   # 全局出口总速率：你在聚合层面的礼貌度
per_host_interval_s = 3.0    # 同一 FQDN 两次请求的最小间隔：真正重要的那个约束
per_host_concurrency = 1     # 同一 FQDN 最大并发连接
per_ip_interval_s   = 1.0    # 额外一层：大量 agent 端点常是同一台机器的不同子域，
                             # 只按 FQDN 限速等于没限。本项目预期正是这个场景。
host_workers        = 200    # 并发的 host worker 数。必须按 host 分桶串行，
                             # 否则 per_host 限速会把全局吞吐压成个位数。
max_attempts_per_target = 2  # 每个端点每轮最多尝试次数。禁止重试风暴。
backoff_base_s      = 2.0    # 429/503 指数退避基数
host_blocklist_after_429 = 3 # 同 host 累计几次 429 后拉黑（记 rate_limited，不是 fail）

[timeouts]
dns_s     = 5.0
connect_s = 10.0
read_s    = 10.0
total_s   = 30.0

[fetch]
max_body_bytes  = 1048576    # 1 MiB。超出记 too_large，防巨型文件/zip bomb
max_redirects   = 3
respect_robots_txt = true    # 仅对 service_name = "web" 的端点生效

[fetch_tiering]
# 【抓取元数据时的分层限速 —— 这是一个明确的、可推翻的取舍，不是偷偷放宽】
#
# [limits] 里的 per_host_interval_s = 3 秒是为【探测 agent 服务】(L3) 定的红线，
# 目标是「绝不成为别人服务器倒下的原因」。
#
# 但抓 agentURI (L1) 打的常常是【批量元数据平台】：实测 agents.exquisite.land
# 一家托管了 1 万份 agent card。对这种主机按 3 秒/请求要跑 8.3 小时，
# 而它本来就是为批量分发这些 JSON 而存在的。
#
# 判据用「行为」而不是「声称」：同一主机上的 URI 数量超过阈值，就按平台对待。
# 无论哪一档，429/503 一律立刻退回保守档并按原规则拉黑 —— 上限可以调，
# 「对方说停就停」不能调。
bulk_host_threshold = 50     # 同一主机 URI 数超过这个值即视为批量元数据平台
bulk_host_rps = 2.0          # 平台档速率（仍远低于任何 CDN 的承受力）
# 低于阈值的主机继续走 [limits] 的 3 秒/请求，不变。

# 【单主机抓取上限 —— 抽样而不是全量】
# 实测 metadata.evoevo.ai 一家持有 49,059 个待抓 URI，且已经开始返回连接超时。
# 对一台已经扛不住的服务器再打 12 小时，既不礼貌，统计上也没有必要：
# 8,000 的样本对该层的比例估计已经是 ±1.1%（95% 置信）。
# 超出上限的 URI 在 uri_fetch 里显式记为 status='sampled_out'，
# 【不是】失败、也【不是】未抓 —— 报告必须把这一层单独算并给出置信区间。
max_uris_per_host = 8000
sample_seed = 8004           # 固定种子，保证复跑抽到同一批

[ipfs]
# 本地 Kubo 节点是第一优先。没有它，9.8 万个 CID 走公共网关必然被限流打死
# —— 这一项直接决定 T3 是 3 小时还是 30 小时。
gateways = [
  "http://127.0.0.1:8080/ipfs/",
  "https://w3s.link/ipfs/",
  "https://ipfs.io/ipfs/",
  "https://dweb.link/ipfs/",
  "https://cloudflare-ipfs.com/ipfs/",
]
max_gateways_per_cid = 3     # 最多试几个网关就放弃，记 ipfs_unresolvable
per_gateway_rps = 5.0        # 每个网关独立令牌桶

[probe]
# 协议层探测行为
a2a_card_paths = ["/.well-known/agent-card.json", "/.well-known/agent.json"]
mcp_transports = ["streamable_http", "sse"]     # streamable 先试，失败再 fallback SSE
mcp_protocol_version = "2025-06-18"             # initialize 请求里声明的版本
mcp_call_tools_list = true                      # 只读且开销极小，能拿到真实能力清单。
                                                # 想更保守就设 false，只做 initialize。
tls_classify_on_failure = true                  # TLS 失败后再做一次不校验连接，纯粹用于
                                                # 分类（expired/self_signed/hostname_mismatch）
                                                # —— 证书问题记录但不算 fail

# 单 host 探测目标上限。同一 host 强制 1 请求/3 秒串行，所以总耗时由【最大的
# host】决定而不是目标总数：实测全量 163,230 个目标里 evoevo.ai 占 36,413 个，
# 不设上限就是 182 小时，其中 90% 在等这一个 host。
# 上限 2,000 时只有 14/3,492 个 host 被抽样，其余全量探测，耗时降到约 10 小时。
# 被抽掉的记为 sampled_out —— 不是失败、不是不活跃，报告须按 host 规模回权。
max_targets_per_host = 2000
sample_seed = 8004                              # 固定种子：复跑抽到同一批，结论可复现

[etherscan]
# Etherscan V2：单 key + chainid 参数覆盖多链
base_url = "https://api.etherscan.io/v2/api"
rps = 4.5                    # 免费档约 5 req/s，留余量
max_addresses = 50000        # 硬上限，防止 API 预算被烧穿。超出则按 L2 存活者优先截断

[spool]
# 网络 stage 先落 JSONL 再入库，避免 DuckDB 单写者锁阻塞你的查询。见 实施规划 §4。
dir = "data/spool"
flush_every_n = 500          # 每 N 条 fsync 一次，杀进程最多丢这么多
