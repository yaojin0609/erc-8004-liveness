# 【不要调回 50000】celo 的 RPC 在窗口内日志过多时【返回 200 + 截断的结果集】，
# 既不报错也不返空 —— 用 50000 的窗口实测漏掉 1,911 个 agent（占该链 19.6%），
# 而重查同一区间就能拿到。批量铸造会在很窄的区块里堆出上万条日志，
# 窗口必须小到不会跨过这种尖峰。agent_id 连续性检查（verify-coverage）用来兜底。
max_log_range = 2000

