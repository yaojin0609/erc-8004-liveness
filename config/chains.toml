# ERC-8004 链配置
#
# rpcs 是【列表】：公共 RPC 会限流（publicnode 用 403 而不是 429），
# 单端点跑不完全量扫描。客户端失败即轮转。带 ${} 的端点在 key 缺失时被自动丢弃，
# 不会导致整条链或整个程序起不来。
#
# deploy_block 留空则由 T0 二分查找填充。需要 archive 节点；公共 RPC 多半不是，
# 失败会优雅降级（记录原因，用首个 Registered 事件所在区块兜底）。
#
# tier = "A" 完整深度分析 | "B" 仅人口普查 | "off" 不扫

[registries]
# ⚠️ 链上实测结论（2026-08-10，Ethereum 主网）：
#    0x8004a169 与 0x8004a818 【都】部署在主网，且【都】是 ERC-721 AgentIdentity。
#    原始思路稿以为是「两条不同的链」，我一度以为是「主网 / 测试网」—— 都不对。
#    正确做法：跑 `e8004 diagnose` 看哪一组真的在被使用（近期 Registered 事件数），
#    结论写进下面三行。candidates 保留全部已知地址供诊断用。
identity   = "0x8004a169fb4a3325136eb29fa0ceb6d2e539a432"
reputation = "0x8004baa17c55a88189ae136b182e5fda19de9b63"
validation = ""    # 官方 README 未列出；T0-2 发现，找不到就留空并全流程跳过

[registries.candidates]
identity_a   = "0x8004a169fb4a3325136eb29fa0ceb6d2e539a432"
reputation_a = "0x8004baa17c55a88189ae136b182e5fda19de9b63"
identity_b   = "0x8004a818bfb912233c491871b3d84c89a494bd9e"
reputation_b = "0x8004b663056a597dffe9eccc1965a193b7388713"

[common]
multicall3 = "0xca11bde05977b3631167028862be2a173976ca11"   # 多链同址
erc721_interface_id = "0x80ac58cd"

# ---------------------------------------------------------------------------
# Tier A —— 完整深度分析
# ---------------------------------------------------------------------------

[[chain]]
name = "ethereum"
chain_id = 1
tier = "A"
rpcs = [
  "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}",
  "https://ethereum-rpc.publicnode.com",
  "https://eth.drpc.org",
  "https://eth.merkle.io",
  "https://rpc.mevblocker.io",
  "https://eth.meowrpc.com",
  "https://1rpc.io/eth",
  "https://rpc.flashbots.net",
]
confirmations = 12
supports_finalized = true
max_log_range = 10000
deploy_block = 24339925      # 2026-01-29 主网上线；T0 仍需二分验证

